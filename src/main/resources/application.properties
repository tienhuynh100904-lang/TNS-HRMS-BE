spring.application.name=tns-hrms

## Database config (SQL Server - Windows Authentication, no username/password).
## The database db_tns_hrms must exist before the first start (SQL Server cannot create it from the JDBC url).
## integratedSecurity=true needs mssql-jdbc_auth-<version>-x64.dll on java.library.path (or in the JDK bin folder).
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=db_tns_hrms;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update

## JWT (HS512 needs a key of at least 64 bytes, base64 encoded).
## The default below is for local development only - set JWT_SECRET_BASE64 in every real environment.
jwt.secret.base64=${JWT_SECRET_BASE64:90uibvNmoLFbG0kTbogJmaTYWkaTHwdOWOVjBGH6h/FXHYyRPOhbHvonX/rv0Fa0IvyrtMAOriCyUHwX6BwuNg==}
jwt.access-token-validity-in-seconds=864000
jwt.refresh-token-validity-in-seconds=8640000

## CORS: comma separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

## Mail (forgot password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

## Default admin account created on first start (only when no account exists yet)
app.seed.admin-email=${ADMIN_EMAIL:tienhc@taynamsteel.com}
app.seed.admin-password=${ADMIN_PASSWORD:123456}

## Nightly pull of punches from the attendance devices: runs the script of each device from the script folder
## (scripts/attendance), needs Python and "pip install -r scripts/attendance/requirements.txt".
## Off by default: turn on with ATTENDANCE_PULL_ENABLED=true on the machine that can reach the devices.
app.attendance.pull.enabled=${ATTENDANCE_PULL_ENABLED:false}
app.attendance.pull.cron=0 0 1 * * *
## Pull once right after startup too (for testing, set ATTENDANCE_PULL_RUN_ON_STARTUP=true)
app.attendance.pull.run-on-startup=${ATTENDANCE_PULL_RUN_ON_STARTUP:false}
app.attendance.pull.python=${PYTHON_CMD:python}
app.attendance.pull.script-dir=${ATTENDANCE_SCRIPT_DIR:scripts/attendance}
app.attendance.pull.output-dir=${ATTENDANCE_OUTPUT_DIR:${java.io.tmpdir}}
app.attendance.pull.timeout-minutes=10
app.attendance.pull.overlap-hours=48
app.attendance.pull.devices[0].branch-code=PKD_ND
app.attendance.pull.devices[0].ip=10.34.1.4
app.attendance.pull.devices[0].port=4370
app.attendance.pull.devices[0].script=zk_pull_punches.py
